services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-mistral-small-latest}
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=*
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data:ro
      - chroma-data:/app/chroma_db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./healthcare-ui
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        # - VITE_API_URL=https://6c9921019269.ngrok-free.app
        - VITE_APP_NAME=${VITE_APP_NAME:-Healthcare Bridge}
        - VITE_APP_SUBTITLE=${VITE_APP_SUBTITLE:-Assistente Cure Domiciliari}
    container_name: healthcare-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma-data:
