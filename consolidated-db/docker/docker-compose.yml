version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: healthbridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-healthbridge_care}
      POSTGRES_USER: ${DB_USER:-healthbridge_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../schema/healthbridge_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-healthbridge_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthbridge_network

  # Unified API Service
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: healthbridge_api
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-healthbridge_care}
      DB_USER: ${DB_USER:-healthbridge_user}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_TOKEN: ${API_TOKEN:?API token required}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - healthbridge_network

  # ETL Service (runs periodically)
  etl:
    build:
      context: ../etl
      dockerfile: Dockerfile
    container_name: healthbridge_etl
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-healthbridge_care}
      DB_USER: ${DB_USER:-healthbridge_user}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      REGISTRY_API_URL: ${REGISTRY_API_URL:-https://clumiddle.aodv.local/AC/pac/rest/paziente}
      REGISTRY_API_TIMEOUT: 30
      AURORA_HOST: ${AURORA_HOST:-10.30.208.195}
      AURORA_PORT: 1521
      AURORA_SERVICE: E4CURE
      AURORA_USER: ${AURORA_USER:-PROG_PILI}
      AURORA_PASSWORD: ${AURORA_PASSWORD:?Aurora password required}
      BOF_API_URL: ${BOF_API_URL:-https://bof.asst-brianza.it/api/v1/index.php}
      BOF_API_TOKEN: ${BOF_API_TOKEN:?BOF token required}
      ETL_BATCH_SIZE: 100
      ETL_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - etl_logs:/var/log/healthbridge
    networks:
      - healthbridge_network
    command: ["python", "scheduler.py"]

volumes:
  postgres_data:
    driver: local
  etl_logs:
    driver: local

networks:
  healthbridge_network:
    driver: bridge
